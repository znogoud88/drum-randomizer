name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exercise list
        run: node scripts/build-manifest.mjs
      - name: Measure loudness (the page plays files unchanged if this fails)
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/at" --no-audit --no-fund @coderline/alphatab@1.8.4
          AT_DIR="$RUNNER_TEMP/at" node scripts/measure-levels.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
